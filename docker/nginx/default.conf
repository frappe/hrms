upstream frappe-server {
    server frappe:8000 fail_timeout=0;
}

upstream frappe-socketio {
    server frappe:9000 fail_timeout=0;
}

# Map for WebSocket connection upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    # No local file serving - everything proxies to frappe
    # root /home/frappe/frappe-bench/sites;  # Not needed

    # Increase buffer sizes
    client_max_body_size 50M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    proxy_read_timeout 120;
    proxy_connect_timeout 120;

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-js text/x-cross-domain-policy application/x-font-ttf
               application/x-font-opentype application/vnd.ms-fontobject
               image/x-icon;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # Assets - proxy to frappe container (frappe has the correct hashes)
    location /assets {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;

        # Cache static assets
        proxy_cache_valid 200 1y;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Protected files - proxy to frappe with internal redirect support
    location ~ ^/protected/(.*) {
        internal;
        proxy_pass http://frappe-server/protected/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;
    }

    # User uploaded files - proxy to frappe container
    location /files {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;

        # Cache control for files
        proxy_cache_valid 200 30d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Socket.IO - proxy to socketio service on port 9000
    location /socket.io {
        proxy_pass http://frappe-socketio;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for WebSocket
        proxy_buffering off;

        # Increase timeouts for long-lived connections
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Main application - all requests go to frappe
    location / {
        # No local file checks - everything proxies to frappe
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;

        # Required for proper functioning
        proxy_buffering off;
        proxy_request_buffering off;
    }
}