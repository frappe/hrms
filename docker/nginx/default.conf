upstream frappe-server {
    server frappe:8000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    root /home/frappe/frappe-bench/sites;

    # Increase buffer sizes
    client_max_body_size 50M;
    client_body_buffer_size 16K;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;

    # Timeouts
    proxy_read_timeout 120;
    proxy_connect_timeout 120;

    # Enable gzip
    gzip on;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-js text/x-cross-domain-policy application/x-font-ttf
               application/x-font-opentype application/vnd.ms-fontobject
               image/x-icon;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    # Static file handling - serve from the assets subdirectory
    location /assets {
        root /home/frappe/frappe-bench/sites;
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/protected/(.*) {
        internal;
        try_files /$1 =404;
    }

    location /files {
        root /home/frappe/frappe-bench/sites;
        # Try to find files in any site's files directory
        try_files /*$uri $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Socket.IO
    location /socket.io {
        proxy_pass http://frappe-server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main application
    location / {
        # Try to find public files for any site
        try_files /*/public/$uri @app;
    }

    location @app {
        proxy_pass http://frappe-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name $host;

        # Required for proper functioning
        proxy_buffering off;
        proxy_request_buffering off;
    }
}