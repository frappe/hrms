<!-- Dual-tone module icons for the desk dock and sidebar headers. Each symbol animates while its dock
     tile is hovered, through the icon-motion custom properties the tile sets (see dock.scss).

     This sprite is inserted into the page, so the style block below is a document stylesheet: it can
     style the tiles that hold an icon as well as the shapes inside one. -->

<svg id="hrms-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Tones. A symbol fills from --duotone-light and --duotone-dark. Only custom properties reach
		   inside a use element, so the surface holding the icon sets them, and a symbol's own
		   fallbacks are the resting tones it wears anywhere else. These rules match the ERPNext
		   sprite's, so HRMS icons behave the same with or without it.

		   Hover is motion alone: a hovered dock tile keeps the resting tones. The active tile moves
		   both tones one token darker (lighter, in the dark theme). The sidebar header never animates;
		   in the dark theme its hover fill is within a few levels of the resting light tone, so there
		   the light tone moves up one token.

		   Every value is a frappe-ui ink token (https://ui.frappe.io/docs/foundations/colors).
		     rest           light: ink-gray-3 / ink-gray-5     dark: ink-gray-3 / ink-gray-6
		     dock hover     as rest
		     header hover   light: as rest                     dark: ink-gray-4 / ink-gray-6
		     active         light: ink-gray-4 / ink-gray-6     dark: ink-gray-4 / ink-gray-7 */
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		/* The briefcase is picked up by its handle and swings as it is carried, while hovered. It
		   loops, so a still copy shows at rest and the moving copy never freezes mid-swing when the
		   pointer leaves. */
		.briefcase-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.briefcase-carried {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 12px 2.75px;
			animation: briefcase-carry 1.4s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes briefcase-carry {
			0%, 100% { transform: translateY(-1px) rotate(0deg); }
			25% { transform: translateY(-1.4px) rotate(5deg); }
			50% { transform: translateY(-1px) rotate(0deg); }
			75% { transform: translateY(-1.4px) rotate(-5deg); }
		}
		/* Tenure: the clock's minute hand sweeps round while hovered. It loops, so a still hand shows
		   at rest and the moving one never freezes mid-sweep when the pointer leaves. An ageing
		   person (grey hair, a stoop) was drawn and dropped for the plain clock. */
		.tenure-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.tenure-minute {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 16.8px 14.6px;
			animation: tenure-sweep 1.6s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes tenure-sweep {
			to { transform: rotate(360deg); }
		}
		/* Recruitment: the magnifier circles, looking, while hovered. A still copy shows at rest. */
		.recruitment-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.recruitment-searching {
			opacity: var(--icon-motion-opacity, 0);
			animation: recruitment-scan 1.8s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes recruitment-scan {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(1.4px, -0.8px); }
			50% { transform: translate(0, -1.4px); }
			75% { transform: translate(-1.4px, -0.8px); }
		}
		/* Tax and Benefits: the front coin flips over like a tossed coin, then rests, while hovered.
		   It loops, so a still copy shows at rest and the moving copy never freezes mid-flip when the
		   pointer leaves. */
		.tax-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.tax-flipping {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 14.6px 13.4px;
			animation: tax-flip 1.8s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes tax-flip {
			0%, 15% { transform: scaleX(1); }
			32.5% { transform: scaleX(0); }
			50%, 100% { transform: scaleX(1); }
		}
		/* Shift and Attendance: the time card dips into the clock to be stamped and comes back up,
		   while hovered. It loops, so a still card shows at rest and the moving one never freezes
		   part-way in when the pointer leaves. The clock's hands stay still. */
		.attendance-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.attendance-punching {
			opacity: var(--icon-motion-opacity, 0);
			animation: attendance-punch 1.6s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes attendance-punch {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(3.2px); }
		}
		/* Leaves: the palm swings from side to side on its island while hovered. A still copy shows
		   at rest. */
		.leaves-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.leaves-swinging {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 11.4px 19.4px;
			animation: leaves-swing 2.2s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes leaves-swing {
			0%, 100% { transform: rotate(0deg); }
			25% { transform: rotate(9deg); }
			75% { transform: rotate(-9deg); }
		}
		/* Performance: the star hops above the winner's block while hovered. It loops, so a still
		   star shows at rest. */
		.performance-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.performance-hopping {
			opacity: var(--icon-motion-opacity, 0);
			animation: performance-hop 1.3s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes performance-hop {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-1.6px); }
		}
		/* Payroll: the notes rise out of the wallet and settle back while hovered. It loops, so still
		   notes show at rest. */
		.payroll-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.payroll-rising {
			opacity: var(--icon-motion-opacity, 0);
			animation: payroll-rise 1.5s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes payroll-rise {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-1.8px); }
		}
		/* Expenses: the card swipes across the receipt and back while hovered. A still card shows
		   at rest. */
		.expenses-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.expenses-swiping {
			opacity: var(--icon-motion-opacity, 0);
			animation: expenses-swipe 1.5s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes expenses-swipe {
			0%, 100% { transform: translateX(0); }
			50% { transform: translateX(-1.8px); }
		}
		@media (prefers-reduced-motion: reduce) {
			.briefcase-carried,
			.tenure-minute,
			.recruitment-searching,
			.tax-flipping,
			.attendance-punching,
			.leaves-swinging,
			.performance-hopping,
			.payroll-rising,
			.expenses-swiping { animation: none; }
		}
	</style>
