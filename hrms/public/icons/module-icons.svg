<!-- Dual-tone module icons for the desk dock and sidebar headers. Each symbol animates while its dock
     tile is hovered, through the icon-motion custom properties the tile sets (see dock.scss).

     This sprite is inserted into the page, so the style block below is a document stylesheet: it can
     style the tiles that hold an icon as well as the shapes inside one. -->

<svg id="hrms-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Tones. A symbol fills from --duotone-light and --duotone-dark. Only custom properties reach
		   inside a use element, so the surface holding the icon sets them, and a symbol's own
		   fallbacks are the resting tones it wears anywhere else. These rules match the ERPNext
		   sprite's, so HRMS icons behave the same with or without it.

		   Hover is motion alone: a hovered dock tile keeps the resting tones. The active tile moves
		   both tones one token darker (lighter, in the dark theme). The sidebar header never animates;
		   in the dark theme its hover fill is within a few levels of the resting light tone, so there
		   the light tone moves up one token.

		   Every value is a frappe-ui ink token (https://ui.frappe.io/docs/foundations/colors).
		     rest           light: ink-gray-3 / ink-gray-5     dark: ink-gray-3 / ink-gray-6
		     dock hover     as rest
		     header hover   light: as rest                     dark: ink-gray-4 / ink-gray-6
		     active         light: ink-gray-4 / ink-gray-6     dark: ink-gray-4 / ink-gray-7 */
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		/* The briefcase is picked up by its handle and swings as it is carried, while hovered. It
		   loops, so a still copy shows at rest and the moving copy never freezes mid-swing when the
		   pointer leaves. */
		.briefcase-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.briefcase-carried {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 12px 2.75px;
			animation: briefcase-carry 1.4s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes briefcase-carry {
			0%, 100% { transform: translateY(-1px) rotate(0deg); }
			25% { transform: translateY(-1.4px) rotate(5deg); }
			50% { transform: translateY(-1px) rotate(0deg); }
			75% { transform: translateY(-1.4px) rotate(-5deg); }
		}
		/* Tenure: the clock's minute hand sweeps round while hovered. It loops, so a still hand shows
		   at rest and the moving one never freezes mid-sweep when the pointer leaves. An ageing
		   person (grey hair, a stoop) was drawn and dropped for the plain clock. */
		.tenure-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.tenure-minute {
			opacity: var(--icon-motion-opacity, 0);
			transform-box: view-box;
			transform-origin: 16.8px 14.6px;
			animation: tenure-sweep 1.6s linear infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes tenure-sweep {
			to { transform: rotate(360deg); }
		}
		/* Recruitment: the magnifier circles, looking, while hovered. A still copy shows at rest. */
		.recruitment-still {
			opacity: calc(1 - var(--icon-motion-opacity, 0));
		}
		.recruitment-searching {
			opacity: var(--icon-motion-opacity, 0);
			animation: recruitment-scan 1.8s ease-in-out infinite;
			animation-play-state: var(--icon-motion, paused);
		}
		@keyframes recruitment-scan {
			0%, 100% { transform: translate(0, 0); }
			25% { transform: translate(1.4px, -0.8px); }
			50% { transform: translate(0, -1.4px); }
			75% { transform: translate(-1.4px, -0.8px); }
		}
		@media (prefers-reduced-motion: reduce) {
			.briefcase-carried,
			.tenure-minute,
			.recruitment-searching { animation: none; }
		}
	</style>
	<symbol viewBox="0 0 24 24" id="icon-briefcase-duotone" stroke="none" style="overflow: visible">
		<g class="briefcase-still">
			<path fill-rule="evenodd" d="M10.1 2.75H13.9Q15.5 2.75 15.5 4.35V7.2H8.5V4.35Q8.5 2.75 10.1 2.75ZM10.5 4.75H13.5V7.2H10.5V4.75Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M4 7H20Q22 7 22 9V12.25H2V9Q2 7 4 7ZM10.2 10.5H13.8V12.25H10.2V10.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path fill-rule="evenodd" d="M2 12.25H22V18Q22 20 20 20H4Q2 20 2 18V12.25ZM10.2 12.25H13.8V14H10.2V12.25Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
		<g class="briefcase-carried">
			<path fill-rule="evenodd" d="M10.1 2.75H13.9Q15.5 2.75 15.5 4.35V7.2H8.5V4.35Q8.5 2.75 10.1 2.75ZM10.5 4.75H13.5V7.2H10.5V4.75Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M4 7H20Q22 7 22 9V12.25H2V9Q2 7 4 7ZM10.2 10.5H13.8V12.25H10.2V10.5Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path fill-rule="evenodd" d="M2 12.25H22V18Q22 20 20 20H4Q2 20 2 18V12.25ZM10.2 12.25H13.8V14H10.2V12.25Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-user-clock-duotone" stroke="none" style="overflow: visible">
		<path fill-rule="evenodd" d="M5.1 7A3.5 3.5 0 1 0 12.1 7A3.5 3.5 0 1 0 5.1 7Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path fill-rule="evenodd" d="M2 19V16.6C2 13.4 4.8 11.9 8.6 11.9C12.4 11.9 15.2 13.4 15.2 16.6V19Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path fill-rule="evenodd" d="M11.4 14.6A5.4 5.4 0 1 0 22.2 14.6A5.4 5.4 0 1 0 11.4 14.6Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<path fill-rule="evenodd" d="M16.8 11.2H16.8Q17.5 11.2 17.5 11.9V14.6Q17.5 15.3 16.8 15.3H16.8Q16.1 15.3 16.1 14.6V11.9Q16.1 11.2 16.8 11.2Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path class="tenure-still" fill-rule="evenodd" d="M16.8 13.9H19.5Q20.2 13.9 20.2 14.6V14.6Q20.2 15.3 19.5 15.3H16.8Q16.1 15.3 16.1 14.6V14.6Q16.1 13.9 16.8 13.9Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path class="tenure-minute" fill-rule="evenodd" d="M16.8 13.9H19.5Q20.2 13.9 20.2 14.6V14.6Q20.2 15.3 19.5 15.3H16.8Q16.1 15.3 16.1 14.6V14.6Q16.1 13.9 16.8 13.9Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-user-search-duotone" stroke="none" style="overflow: visible">
		<g class="recruitment-still">
			<path fill-rule="evenodd" d="M4 9.4A5.8 5.8 0 1 0 15.6 9.4A5.8 5.8 0 1 0 4 9.4Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path fill-rule="evenodd" d="M7.7 7.9A2.1 2.1 0 1 0 11.9 7.9A2.1 2.1 0 1 0 7.7 7.9ZM6.200000000000001 13.6V13.2C6.200000000000001 11.6 7.9 10.6 9.8 10.6C11.700000000000001 10.6 13.4 11.6 13.4 13.2V13.6Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M2.5 9.4A7.3 7.3 0 1 0 17.1 9.4A7.3 7.3 0 1 0 2.5 9.4ZM4 9.4A5.8 5.8 0 1 0 15.6 9.4A5.8 5.8 0 1 0 4 9.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M14.09 15.95L19.69 21.35L21.91 19.05L16.31 13.65Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
		<g class="recruitment-searching">
			<path fill-rule="evenodd" d="M4 9.4A5.8 5.8 0 1 0 15.6 9.4A5.8 5.8 0 1 0 4 9.4Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path fill-rule="evenodd" d="M7.7 7.9A2.1 2.1 0 1 0 11.9 7.9A2.1 2.1 0 1 0 7.7 7.9ZM6.200000000000001 13.6V13.2C6.200000000000001 11.6 7.9 10.6 9.8 10.6C11.700000000000001 10.6 13.4 11.6 13.4 13.2V13.6Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M2.5 9.4A7.3 7.3 0 1 0 17.1 9.4A7.3 7.3 0 1 0 2.5 9.4ZM4 9.4A5.8 5.8 0 1 0 15.6 9.4A5.8 5.8 0 1 0 4 9.4Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
			<path fill-rule="evenodd" d="M14.09 15.95L19.69 21.35L21.91 19.05L16.31 13.65Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		</g>
	</symbol>
</svg>
