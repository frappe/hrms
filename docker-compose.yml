version: "3.8" # Updated version
services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed # Temporary fix for MariaDB 10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    build:
      context: ./docker
      dockerfile: Dockerfile
    environment:
      - SHELL=/bin/bash
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SITE_NAME=${SITE_NAME:-hrms.localhost}
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - frappe-sites:/home/frappe/frappe-bench/sites
    expose:
      - "8000"
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "test -d /home/frappe/frappe-bench/sites/assets/frappe/dist/css && ls /home/frappe/frappe-bench/sites/assets/frappe/dist/css/*.css >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    depends_on:
      frappe:
        condition: service_healthy
    ports:
      - "8000:80"
    # No volume mount - nginx will serve built-in assets and proxy dynamic files to frappe

volumes:
  mariadb-data:
  frappe-sites: