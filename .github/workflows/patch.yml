name: Patch

on:
  pull_request:
    paths-ignore:
      - '**.js'
      - '**.css'
      - '**.md'
      - '**.html'
      - '**.csv'
      - 'crowdin.yml'
      - '.mergify.yml'
      - '**.vue'
      - '**.pot'
      - '**.po'

  workflow_dispatch:

concurrency:
  group: patch-develop-${{ github.event_name }}-${{ github.event.number || github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    name: Patch Test

    services:
      mysql:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Check for valid Python & Merge Conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.11
            3.13
            3.14

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          DB: mariadb
          TYPE: server

      - name: Run Patch Tests
        run: |
          set -eo pipefail
          cd ~/pilot/benches/frappe-bench/
          pilot -b frappe-bench uninstall-app test_site lending --force
          pilot -b frappe-bench uninstall-app test_site payments --force
          # Frappe's restore helper reads the bench inventory even after the
          # optional apps have been removed from the site.
          printf 'frappe\nerpnext\nhrms\n' > sites/apps.txt
          jq 'del(.install_apps)' sites/test_site/site_config.json > tmp.json
          mv tmp.json sites/test_site/site_config.json

          wget -q https://frappe.io/files/frappe-hr-v14-p.sql.gz
          (
            cd sites
            ../env/bin/python -m frappe.utils.bench_helper frappe --site test_site restore \
              --db-root-username root --db-root-password root \
              --force ~/pilot/benches/frappe-bench/frappe-hr-v14-p.sql.gz
          )

          for app in frappe erpnext hrms; do
            git -C "apps/$app" remote remove upstream 2>/dev/null || true
            git -C "apps/$app" remote add upstream "https://github.com/frappe/${app}.git"
          done
          git -C "apps/hrms" branch -f pr-head HEAD

          start_pilot() {
            pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
            curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
              http://127.0.0.1:7000/api/v1/health
          }

          function update_to_version() {
            version=$1
            branch_name="version-$version-hotfix"
            echo "Updating to v$version"

            git -C "apps/frappe" fetch --depth 1 upstream "$branch_name:$branch_name"
            git -C "apps/erpnext" fetch --depth 1 upstream "$branch_name:$branch_name"
            git -C "apps/hrms" fetch --depth 1 upstream "$branch_name:$branch_name"
            git -C "apps/frappe" checkout -q -f "$branch_name"
            git -C "apps/erpnext" checkout -q -f "$branch_name"
            git -C "apps/hrms" checkout -q -f "$branch_name"

            pilot -b frappe-bench stop || true
            rm -rf ~/pilot/benches/frappe-bench/env
            uv venv --python "python$2" ~/pilot/benches/frappe-bench/env
            uv pip install --python ~/pilot/benches/frappe-bench/env/bin/python -e ./apps/frappe -e ./apps/erpnext -e ./apps/hrms
            start_pilot

            pilot -b frappe-bench frappe --site test_site migrate
          }

          update_to_version 15 3.13
          update_to_version 16 3.14

          echo "Updating to latest version"
          target_branch="${GITHUB_BASE_REF:-develop}"
          if ! git -C "apps/frappe" ls-remote --exit-code --heads upstream "$target_branch" >/dev/null 2>&1; then
            target_branch="develop"
          fi
          git -C "apps/frappe" fetch --depth 1 upstream "$target_branch"
          git -C "apps/frappe" checkout -q -f FETCH_HEAD
          git -C "apps/erpnext" fetch --depth 1 upstream "$target_branch"
          git -C "apps/erpnext" checkout -q -f FETCH_HEAD
          git -C "apps/hrms" checkout -q -f pr-head

          pilot -b frappe-bench stop || true
          rm -rf ~/pilot/benches/frappe-bench/env
          uv venv --python python3.14 ~/pilot/benches/frappe-bench/env
          uv pip install --python ~/pilot/benches/frappe-bench/env/bin/python -e ./apps/frappe -e ./apps/erpnext -e ./apps/hrms
          start_pilot

          pilot -b frappe-bench frappe --site test_site migrate

      - name: Show Pilot output
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/pilot.log" || true
          cat ~/pilot/benches/frappe-bench/logs/*.log || true

      - name: Stop Pilot
        if: ${{ always() }}
        run: ~/pilot/bin/pilot -b frappe-bench stop || true